<div class="form-container">
<h3>{{ isEditMode() ? 'Adresse bearbeiten' : 'Neue Adresse anlegen' }}</h3>

<form (submit)="onSubmit($event)">

  <!-- Zeile 1: Vorname & Nachname -->
  <div class="form-row">
    <app-form-field labelText="Vorname" [field]="addressForm.firstName" [submitted]="formSubmitted()">
      <input type="text" [formField]="addressForm.firstName" />
    </app-form-field>

    <app-form-field labelText="Nachname" [field]="addressForm.lastName" [submitted]="formSubmitted()">
      <input type="text" [formField]="addressForm.lastName" />
    </app-form-field>
  </div>

  <!-- Zeile 2: E-Mail & Telefon -->
  <div class="form-row">
    <app-form-field labelText="E-Mail" [field]="addressForm.email" [submitted]="formSubmitted()">
      <input type="email" [formField]="addressForm.email" />
    </app-form-field>

    <app-form-field labelText="Telefon" [field]="addressForm.phone" [submitted]="formSubmitted()">
      <input type="tel" [formField]="addressForm.phone" />
    </app-form-field>
  </div>

  <!-- Zeile 3: Straße & Bundesland / Zusatz -->
  <div class="form-grid-street">
    <app-form-field labelText="Straße" [field]="addressForm.street" [submitted]="formSubmitted()">
      <input type="text" [formField]="addressForm.street" />
    </app-form-field>


  </div>

  <!-- Zeile 4: PLZ & Ort -->
  <div class="form-grid-zip-city">
    <app-form-field labelText="PLZ" [field]="addressForm.zipCode" [submitted]="formSubmitted()">
      <input type="text" [formField]="addressForm.zipCode" />
    </app-form-field>

    <app-form-field labelText="Ort" [field]="addressForm.city" [submitted]="formSubmitted()">
      <input type="text" [formField]="addressForm.city" />
    </app-form-field>
  </div>

  <!-- NEUE ZEILE: Land & Bundesland nebeneinander -->
  <div class="form-row">
    <app-form-field labelText="Land" [field]="addressForm.country" [submitted]="formSubmitted()">
      <!-- change-Event leert das Bundesland bei Länderwechsel, um Falscheingaben zu verhindern -->
      <select
        [formField]="addressForm.country"
        (change)="formModel.update(m => ({ ...m, state: '' }))"
      >
        <option value="">Bitte ein Land auswählen...</option>
        @for (c of countries(); track c.code) {
          <option [value]="c.code">{{ c.name }}</option>
        }
      </select>
    </app-form-field>

    <app-form-field labelText="Bundesland" [field]="addressForm.state" [submitted]="formSubmitted()">
      <!-- Das [disabled] wurde hier entfernt, da es jetzt von TypeScript verwaltet wird -->
      <select [formField]="addressForm.state">
        <option value="">Bitte wählen...</option>
        @for (s of filteredStates(); track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </app-form-field>

  </div>

  <!-- FOLGEZEILE: Die Kategorie wandert in eine eigene Zeile (oder teilt sich den Platz mit einem anderen Feld) -->
  <div class="form-row">
    <app-form-field labelText="Kategorie" [field]="addressForm.category" [submitted]="formSubmitted()">
      <select [formField]="addressForm.category">
        <option value="Personal">Privat</option>
        <option value="Work">Geschäftlich</option>
        <option value="Other">Sonstige</option>
      </select>
    </app-form-field>
  </div>


  <!-- Zeile 6: Geburtstag & Optionen -->
  <div class="birthday-section">
    @if (formModel().hideYear) {
      <label class="form-label">Geburtstag</label>
      <div class="d-flex gap-2">
        <div class="w-50">
          <label class="small text-muted">Tag</label>
          <!-- REINES SIGNAL FORMS BINDING via [formField] -->
          <select class="form-select" [formField]="addressForm.birthdayDay" (change)="onDayChange($any($event.target).value)">
            <option value="">wählen...</option>
            @for (d of days; track d) {
              <option [value]="d">{{ d }}</option>
            }
          </select>
        </div>

        <div class="w-50">
          <label class="small text-muted">Monat</label>
          <!-- REINES SIGNAL FORMS BINDING via [formField] -->
          <select class="form-select" [formField]="addressForm.birthdayMonth" (change)="onMonthChange($any($event.target).value)">
            <option value="">wählen...</option>
            @for (m of months; track m) {
              <option [value]="m">{{ m }}</option>
            }
          </select>
        </div>
      </div>
    } @else {
      <input type="date" class="form-control" [formField]="addressForm.birthdayDate" (change)="addressForm.birthdayDate().markAsDirty()" />
    }

    <!-- Checkbox für Jahr ausblenden -->
    <div class="checkbox-row">
      <input
        type="checkbox"
        id="hideYearCheckbox"
        [formField]="addressForm.hideYear"
      />
      <label for="hideYearCheckbox">Geburtsjahr geheim halten (Alter wird verborgen)</label>
    </div>
  </div>

  <!-- Buttons -->
  <div class="form-actions">
    <button type="button" routerLink="/" class="btn-cancel">Abbrechen</button>
    <button type="submit" class="btn-submit">Eintrag speichern</button>
  </div>

</form>
</div>
