<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Directory</h2>
    <a routerLink="/add" class="btn btn-primary">+ Add Address</a>
  </div>

  <input type="text" class="form-control mb-3" placeholder="Filter entry..." (input)="onSearch($event)">

  <table class="table table-striped">
    <thead>
    <tr><th>Name</th><th>Email</th><th>City</th><th>Category</th><th>Actions</th></tr>
    </thead>
    <tbody>
      @for (addr of addressService.filteredAddresses(); track addr.id) {
        <tr>
          <td>{{ addr.lastName }}, {{ addr.firstName }}</td>
          <td>{{ addr.email }}</td>
          <td>{{ addr.city }}</td>
          <td><span class="badge bg-secondary">{{ addr.category }}</span></td>
          <td>
            <a [routerLink]="['/edit', addr.id]" class="btn btn-sm btn-warning me-2">Edit</a>
            <button (click)="addressService.deleteAddress(addr.id)" class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center text-muted">No entries match your structural query.</td></tr>
      }
    </tbody>
  </table>
</div>
